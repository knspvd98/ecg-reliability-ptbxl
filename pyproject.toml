[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-reliability-ptbxl"
version = "0.2.0"
description = "Reproducible ECG machine learning reliability research platform and interactive workbench for PTB-XL."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Dias Konyspayev" }]
keywords = ["ecg", "machine-learning", "calibration", "selective-prediction", "ptb-xl", "reliability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "captum>=0.7.0",
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "pyarrow>=15.0.0",
  "PyYAML>=6.0.0",
  "scikit-learn>=1.4.0",
  "scipy>=1.12.0",
  "torch>=2.2.0",
  "tqdm>=4.66.0",
  "wfdb>=4.1.2",
  "xgboost>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
ecg-reliability = "ecg_reliability.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ecg_reliability*"]

[tool.setuptools.package-data]
"ecg_reliability.workbench" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv*", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
